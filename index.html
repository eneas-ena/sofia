/* ===================== DESIGN SYSTEM (tokens) ===================== */
:root{
  --primaria:#1D4ED8; --sobre-primaria:#FFFFFF;
  --texto:#111827; --texto2:#4B5563;
  --sucesso:#15803D; --sucesso-suave:#F0FDF4; --sobre-sucesso:#FFFFFF;
  --erro:#B91C1C; --erro-suave:#FEF2F2; --sobre-erro:#FFFFFF;
  --conquista:#F59E0B; --sobre-conquista:#111827;
  --fundo:#F8FAFC; --superficie:#FFFFFF; --destaque:#EFF6FF; --borda:#E5E7EB;
  --rotulo:#1D4ED8;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --primaria:#60A5FA; --sobre-primaria:#0F172A;
  --texto:#F9FAFB; --texto2:#CBD5E1;
  --sucesso:#4ADE80; --sucesso-suave:#052E16; --sobre-sucesso:#052E16;
  --erro:#F87171; --erro-suave:#450A0A; --sobre-erro:#450A0A;
  --conquista:#FBBF24; --sobre-conquista:#0F172A;
  --fundo:#0F172A; --superficie:#1E293B; --destaque:#1E3A8A; --borda:#334155;
  --rotulo:#BFDBFE;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primaria);outline-offset:2px}
h1:focus,h2:focus,[tabindex="-1"]:focus{outline:none}

/* ===================== LAYOUT ===================== */
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.tela{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.tela.com-nav{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.acoes{margin-top:auto;padding-top:24px}

/* ===================== TIPOGRAFIA ===================== */
.titulo{font-size:1.5rem;font-weight:700;line-height:2rem}
.subtitulo{font-size:1.125rem;font-weight:600;line-height:1.75rem}
.legenda{font-size:.875rem;line-height:1.25rem;color:var(--texto2)}
.sec{color:var(--texto2)}
.enunciado{margin:8px 0}

/* ===================== TOPO ===================== */
.topo{display:flex;align-items:center;gap:4px;min-height:56px;margin-bottom:8px}
.topo .subtitulo{flex:1}
.cab-inicio{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.btn-icone{width:48px;height:48px;border-radius:50%;border:1px solid var(--borda);background:var(--superficie);color:var(--texto);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn-voltar{border:none;background:transparent;margin-left:-12px}

/* ===================== BOTÕES ===================== */

/* ---------- Datas ---------- */
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function idxSemana(d) { return (d.getDay() + 6) % 7; } // Seg=0 ... Dom=6
function dataExtenso(d) {
  const s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function hojeISO() { return isoLocal(new Date()); }
function segundaDe(d) { const s = new Date(d); s.setHours(12, 0, 0, 0); s.setDate(s.getDate() - idxSemana(s)); return s; }
function numSemana(seg) { return Math.floor(Date.UTC(seg.getFullYear(), seg.getMonth(), seg.getDate()) / 604800000); }
function dataCurta(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function listaTexto(arr) { return arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1]; }

/* =================== PLANO DA SEMANA =================== */
/* Base do prompt (Seg Mat · Ter Bio/Quí · Qua Linguagens · Qui Física/Mat · Sex Humanas · Sáb Redação/revisão),
   ajustada pelo diagnóstico:
   - Terça e quinta: se uma das duas matérias está 30 pontos ou mais abaixo, ela fica com o dia;
     se estão parecidas, alternam a cada semana (começando pela mais fraca).
   - Sábado: uma semana Redação, na outra revisão da matéria mais fraca. */
function gerarPlano(seg) {
  const nv = S.niveis || {}, par = numSemana(seg) % 2 === 0;
  const n = function (a) { return nv[a] || 0; };
  function escolher(a, b) {
    const fraca = n(a) <= n(b) ? a : b, forte = fraca === a ? b : a;
    if (Math.abs(n(a) - n(b)) >= 30) return fraca;
    return par ? fraca : forte;
  }
  const maisFraca = AREAS.slice().sort(function (x, y) { return n(x) - n(y); })[0];
  return [
    { dia: 0, area: 'Matemática', tipo: 'aula' },
    { dia: 1, area: escolher('Biologia', 'Química'), tipo: 'aula' },
    { dia: 2, area: 'Linguagens', tipo: 'aula' },
    { dia: 3, area: escolher('Física', 'Matemática'), tipo: 'aula' },
    { dia: 4, area: 'Ciências Humanas', tipo: 'aula' },
    par ? { dia: 5, area: 'Redação', tipo: 'redacao' } : { dia: 5, area: maisFraca, tipo: 'revisao' }
  ];
}
function planoSalvo(segISO) {
  const p = (S.planos || []).find(function (x) { return x.semana === segISO; });
  return p ? p.plano : null;
}
function planoDe(seg) { return planoSalvo(isoLocal(seg)) || gerarPlano(seg); }
function tituloItem(r) {
  if (r.tipo === 'revisao') return 'Revisão · ' + r.area;
  return r.area + (r.assunto ? ' · ' + r.assunto : '');
}
/* Projeta os assuntos: quem faltou não acumula, o assunto só passa para a próxima aula daquela matéria */
function criarSeletor() {
  const est = new Set((S.estudados || []).map(function (e) { return e.materia + '|' + e.assunto; }));
  const reservados = {};
  return function (area) {
    const t = TRILHAS[area] || [];
    reservados[area] = reservados[area] || new Set();
    for (let i = 0; i < t.length; i++) {
      if (!est.has(area + '|' + t[i]) && !reservados[area].has(t[i])) { reservados[area].add(t[i]); return t[i]; }
    }
    return 'Revisão geral';
  };
}
function projetarSemana(base) {
  const agora = base || new Date(), hi = idxSemana(agora), seg = segundaDe(agora);
  const plano = planoDe(seg), feitos = new Set(S.dias), proximo = criarSeletor();
  return plano.map(function (p) {
    const d = new Date(seg); d.setDate(seg.getDate() + p.dia);
    const iso = isoLocal(d);
    const r = { dia: p.dia, data: d, iso: iso, area: p.area, tipo: p.tipo };
    if (feitos.has(iso)) {
      const a = (S.aulasRecentes || []).find(function (x) { return x.dia === iso; });
      r.status = 'feito';
      r.titulo = a ? a.materia + ' · ' + a.assunto : tituloItem(r);
    } else if (p.dia < hi) {
      r.status = 'perdido';
      r.titulo = r.tipo === 'revisao' ? 'Revisão · ' + r.area : r.area;
    } else {
      r.status = p.dia === hi ? 'hoje' : 'futuro';
      if (r.tipo !== 'revisao') r.assunto = proximo(r.area);
      r.titulo = tituloItem(r);
    }
    return r;
  });
}
function aulaDeHoje() {
  const hi = idxSemana(new Date());
  return hi < 6 ? projetarSemana()[hi] : null;
}
function proximoAssunto() {
  const hoje = new Date(), hi = idxSemana(hoje);
  if (hi < 5) return 'Amanhã: ' + projetarSemana()[hi + 1].titulo + '.';
  const seg = segundaDe(hoje); seg.setDate(seg.getDate() + 7);
  const p = planoDe(seg)[0], r = { area: p.area, tipo: p.tipo };
  if (p.tipo !== 'revisao') r.assunto = criarSeletor()(p.area);
  const titulo = tituloItem(r);
  return hi === 5 ? 'Amanhã é domingo, dia de descanso. Na segunda: ' + titulo + '.' : 'Amanhã: ' + titulo + '.';
}
function textoAtencao() {
  const nv = S.niveis || {};
  const fracas = AREAS.filter(function (a) { return (nv[a] || 0) < 50; })
    .sort(function (x, y) { return (nv[x] || 0) - (nv[y] || 0); }).slice(0, 3);
  return fracas.length
    ? 'Vou dar atenção especial a ' + listaTexto(fracas) + '.'
    : 'Você foi bem em todas as áreas do diagnóstico. Vamos manter o ritmo e aprofundar.';
}
function duracaoAula(r) {
  const m = (S.perfil && MINUTOS[S.perfil.tempo_diario]) || 60;
  return m + ' min · ' + (r.tipo === 'redacao' ? 'explicação e escrita' : r.tipo === 'revisao' ? 'revisão e exercícios' : 'revisão, explicação e exercícios');
}
/* Sequência de dias: domingo sem estudo não quebra a sequência */
function calcularSequencia(dias) {
  const set = new Set(dias || []);
  const d = new Date();
  if (!set.has(isoLocal(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  for (let k = 0; k < 400; k++) {
    if (set.has(isoLocal(d))) n++;
    else if (d.getDay() !== 0) break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function textoSequencia(n) { return n === 1 ? '1 dia seguido' : n + ' dias seguidos'; }

/* =================== CONEXÃO COM O SUPABASE =================== */
async function rpc(nome, params, cracha) {
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nome, {
      method: 'POST',
      headers: Object.assign({ 'apikey': SUPABASE_CHAVE, 'Content-Type': 'application/json', 'Content-Profile': SCHEMA, 'Accept-Profile': SCHEMA }, cracha ? { 'Authorization': 'Bearer ' + cracha } : {}),
      body: JSON.stringify(params || {})
    });
  } catch (e) {
    throw new Error('Sem conexão com a internet. Confira e tente de novo.');
  }
  let dados = null;
  try { dados = await r.json(); } catch (e) { }
  if (!r.ok) {
    console.error('Sofia:', nome, r.status, dados);
    throw new Error('Não consegui falar com o servidor (erro ' + r.status + '). Tente de novo daqui a pouco.');
  }
  if (dados && dados.erro) {
    const e = new Error(dados.erro === 'sessao' ? 'Sua sessão terminou. Entre de novo com seu usuário e PIN.' : dados.erro);
    e.codigo = dados.erro;
    throw e;
  }
  return dados;
}
function lerToken() { try { return localStorage.getItem(CHAVE_TOKEN); } catch (e) { return null; } }

  const iso = isoLocal(seg);
  S.planos = [{ semana: iso, plano: plano }].concat((S.planos || []).filter(function (x) { return x.semana !== iso; }));

  catch (e) { console.error('Sofia: plano não salvo', e); } // o plano continua valendo neste celular
}

function baloes(falas, id) {

function htmlQuestao(q, resp, interativa, numero) {
  const respondida = resp != null;

    }

  }).join('');

    retorno = balao(resp === q.correta
      ? '<strong>Isso!</strong> ' + txt(q.explicacao)

/* =================== AÇÕES =================== */
function calcularNiveis(resp) {
  const tot = {}, ac = {}, niv = {};
  let total = 0;
  DIAG.forEach(function (q, i) {
    tot[q.area] = (tot[q.area] || 0) + 1;
    if (resp[i] === q.correta) { ac[q.area] = (ac[q.area] || 0) + 1; total++; }
  });
  AREAS.forEach(function (a) { niv[a] = tot[a] ? Math.round((ac[a] || 0) / tot[a] * 100) : 0; });
  return { niveis: niv, acertos: total };
}
function ir(t, msg) { tela = t; erroMsg = msg || null; render(); }

/* Executa uma tarefa que fala com o servidor, mostrando "Aguarde…" e os erros */
async function executar(tarefa) {
  if (ocupado) return;
  ocupado = true; erroMsg = null; render();
  try {
    await tarefa();
    ocupado = false; render();
  } catch (e) {
    ocupado = false;
    if (e.codigo === 'sessao') { apagarToken(); token = null; ent = { usuario: '', pin: '', esqueci: false }; ir('entrar', e.message); render('#erro'); return; }
    erroMsg = e.message || 'Algo deu errado.';
    render('#erro');
  }
}

/* =================== CONVERSA COM A IA (Worker) =================== */
function guardarAula() {
  try {
    const c = Object.assign({}, au); delete c.carregando; delete c.erro; delete c.limite; delete c.sel;
    localStorage.setItem(CHAVE_AULA, JSON.stringify(c));
  } catch (e) { }
}
function lerAulaSalva() { try { return JSON.parse(localStorage.getItem(CHAVE_AULA) || 'null'); } catch (e) { return null; } }
function apagarAulaSalva() { try { localStorage.removeItem(CHAVE_AULA); } catch (e) { } }
function temAulaEmAndamento() {
  const s = lerAulaSalva();
  return !!(s && s.dia === hojeISO() && S.perfil && s.usuario === S.perfil.usuario && s.conversa && s.conversa.length);
}
async function pedirIA() {
  au.carregando = true; au.erro = null; au.limite = false; render();
  try {
    let r;
    try {
      r = await fetch(IA_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: token,
          aula: { area: au.area, assunto: au.assunto, tipo: au.tipo },
          conversa: au.conversa.map(function (it) { return it.de === 'sofia' ? { de: 'sofia', dados: it.dados } : { de: 'aluna', texto: it.texto }; })
        })
      });
    } catch (e) { throw new Error('Sem conexão com a internet. Confira e tente de novo.'); }
    const d = await r.json().catch(function () { return null; });
    if (!d) throw new Error('A Sofia não respondeu (erro ' + r.status + '). Tente de novo.');
    if (d.erro === 'sessao') { const e = new Error('Sua sessão terminou. Entre de novo com seu usuário e PIN.'); e.codigo = 'sessao'; throw e; }
    if (d.erro === 'limite') { au.limite = true; throw new Error('Você já estudou bastante hoje! O limite diário de conversa com a Sofia foi atingido. Amanhã tem mais.'); }
    if (!r.ok || d.erro || !d.resposta) throw new Error(d.erro || 'A Sofia não respondeu. Tente de novo.');
    au.conversa.push({ de: 'sofia', dados: d.resposta });
    au.atual = d.resposta; au.sel = null; au.carregando = false;
    guardarAula();
    if (tela === 'aula') render('#nova');
  } catch (e) {
    au.carregando = false;
    if (e.codigo === 'sessao') { apagarToken(); token = null; ent = { usuario: '', pin: '', esqueci: false }; ir('entrar', e.message); return; }
    au.erro = e.message; guardarAula();
    if (tela === 'aula') render('#erro');
  }
}
function falarComIA(texto, mostrar) {
  if (au.carregando) return;
  au.conversa.push({ de: 'aluna', texto: texto, mostrar: mostrar });
  pedirIA();
}

async function finalizarDiag() {
  const r = calcularNiveis(dg.resp);
  await executar(async function () {
    await rpc('salvar_diagnostico', { p_token: token, p_respostas: dg.resp.map(function (x) { return x == null ? null : x; }), p_acertos: r.acertos, p_niveis: r.niveis });
    S.niveis = r.niveis; S.acertosDiag = r.acertos; S.diagFeito = true;
    const seg = segundaDe(new Date());
    await salvarPlano(seg, gerarPlano(seg)); // plano refeito com o resultado novo
    ir('diagResultado');
  });
}
function avancarDiag() {
  if (dg.i >= DIAG.length - 1) { finalizarDiag(); return; }
  dg.i++;
  dg.sel = dg.resp[dg.i] != null ? dg.resp[dg.i] : null;
  telaAnterior = null; render();
}

/* ---------- Administrador ---------- */
async function admExecutar(tarefa) {
  await executar(async function () {
    try { await tarefa(); }
    catch (e) {
      if (/erro 401|JWT/i.test(e.message)) { adm.token = null; ir('admLogin', 'Sua entrada de administrador expirou. Entre de novo.'); return; }
      throw e;
    }
    const r = await rpc('adm_lista', {}, adm.token);
    adm.lista = r.alunas || [];
  });
}
function admCarregar() { admExecutar(async function () { }); }
function admMudar(id, situacao, aviso) {
  admExecutar(async function () {
    await rpc('adm_situacao', { p_id: id, p_situacao: situacao }, adm.token);
    adm.confirmar = null; adm.pinPara = null; adm.aviso = aviso;
  });
}

/* ---------- Atualização do app ---------- */
async function atualizarAgora() {
  try { if ('serviceWorker' in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function (r) { return r.unregister(); })); } } catch (e) { }
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(function (k) { return caches.delete(k); })); } } catch (e) { }
  location.replace(location.href.split('#')[0].split('?')[0] + '?v=' + Date.now());
}
async function verificarVersao() {
  try {
    const r = await fetch(location.href.split('#')[0].split('?')[0] + '?nc=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const VERSAO = '([^']+)'/);
    if (!m || m[1] === VERSAO || document.getElementById('aviso-versao')) return;
    const d = document.createElement('div');
    d.id = 'aviso-versao'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>Nova versão da Sofia (v' + esc(m[1]) + ')</span><button type="button">Atualizar agora</button>';
    d.querySelector('button').addEventListener('click', atualizarAgora);
    document.body.appendChild(d);
  } catch (e) { }
}

const ACOES = {
  tema: function () {
    tema = tema === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(CHAVE_TEMA, tema); } catch (e) { }
    aplicarTema(); render('[data-acao="tema"]');
  },
  tentarDeNovo: function () { iniciar(); },
  comecar: function () { cad = { passo: 0, dados: {} }; ir('cadastro'); },
  irEntrar: function () { ent = { usuario: '', pin: '', esqueci: false }; ir('entrar'); },
  entrarVoltar: function () { ir('boas'); },
  esqueciPin: function () { ent.esqueci = true; render(); },
  aguardandoEntrar: function () { ent = { usuario: pend ? pend.usuario : '', pin: '', esqueci: false }; ir('entrar'); },
  atualizarApp: function () { atualizarAgora(); },

  irAdm: function () { if (adm.token) { ir('adm'); admCarregar(); } else ir('admLogin'); },
  admEntrar: function () {
    if (!(adm.email.trim() && adm.senha)) return;
    executar(async function () {
      let r, d;
      try {
        r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST', headers: { 'apikey': SUPABASE_CHAVE, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: adm.email.trim(), password: adm.senha })
        });
        d = await r.json().catch(function () { return null; });
      } catch (e) { throw new Error('Sem conexão com a internet. Confira e tente de novo.'); }
      if (!r.ok || !d || !d.access_token) throw new Error('E-mail ou senha incorretos.');
      const lista = await rpc('adm_lista', {}, d.access_token);
      adm.senha = ''; adm.token = d.access_token; adm.lista = lista.alunas || [];
      adm.filtro = adm.lista.some(function (a) { return a.situacao === 'pendente'; }) ? 'pendente' : 'todos';
      adm.aviso = null; adm.confirmar = null; adm.pinPara = null;
      ir('adm');
    });
  },
  admFiltro: function (f) { adm.filtro = f; adm.confirmar = null; adm.pinPara = null; render(); },
  admRecarregar: function () { adm.aviso = null; admCarregar(); },
  admAprovar: function (id) { admMudar(id, 'aprovado', 'Conta aprovada.'); },
  admBloquear: function (id) { admMudar(id, 'bloqueado', 'Conta bloqueada.'); },
  admPinAbrir: function (id) { adm.pinPara = adm.pinPara === id ? null : id; adm.pin = ''; adm.confirmar = null; render('#adm-pin'); },
  admPinSalvar: function (id) {
    if (!/^\d{4}$/.test(adm.pin)) { erroMsg = 'O PIN precisa ter 4 números.'; render('#erro'); return; }
    admExecutar(async function () {
      await rpc('adm_novo_pin', { p_id: id, p_pin: adm.pin }, adm.token);
      adm.pinPara = null; adm.pin = ''; adm.aviso = 'PIN novo salvo. Passe o PIN para a aluna.';
    });
  },
  admExcluir: function (id) {
    if (adm.confirmar !== id) { adm.confirmar = id; adm.pinPara = null; render(); return; }
    admExecutar(async function () {
      await rpc('adm_excluir', { p_id: id }, adm.token);
      adm.confirmar = null; adm.aviso = 'Conta excluída.';
    });
  },
  admSair: function () { adm = { email: adm.email, senha: '', token: null, lista: [], filtro: 'pendente', pinPara: null, pin: '', confirmar: null, aviso: null }; ir('boas'); },
  entrar: function () {
    if (!(ent.usuario.trim() && /^\d{4}$/.test(ent.pin))) return;
    executar(async function () {
      const r = await rpc('entrar', { p_usuario: ent.usuario.trim(), p_pin: ent.pin });
      ent.pin = '';
      if (r.pendente) { pend = { usuario: r.usuario, nome: r.nome }; ir('aguardando'); return; }
      token = r.token; gravarToken(token);
      await carregarDados();
      ir(S.diagFeito ? 'inicio' : 'diagIntro');
    });
  },

  cadOpcao: function (v) { cad.dados[PERG_CAD[cad.passo].chave] = v; render('[data-acao="cadOpcao"][aria-checked="true"]'); },
  cadContinuar: function () {
    if (!cadPodeSeguir()) return;
    if (cad.passo < PERG_CAD.length - 1) { cad.passo++; erroMsg = null; telaAnterior = null; render(); return; }
    const d = cad.dados;
    executar(async function () {
      const r = await rpc('cadastrar', {
        p_nome: d.nome.trim(), p_curso: d.curso,
        p_ano: parseInt(String(d.ano).replace(/\D/g, ''), 10) || null,
        p_tempo: d.tempo, p_adaptacao: d.adaptacao || null, p_pin: d.pin
      });
      cad = { passo: 0, dados: {} };          // o PIN não fica guardado no celular
      if (r.pendente || !r.token) { pend = { usuario: r.usuario, nome: r.nome }; ir('aguardando'); return; }
      token = r.token; gravarToken(token);
      await carregarDados();
      ir('contaCriada');
    });
  },
  cadVoltar: function () { erroMsg = null; if (cad.passo > 0) { cad.passo--; telaAnterior = null; render(); } else ir('boas'); },

  irDiagIntro: function () { ir('diagIntro'); },
  diagIniciar: function () { dg = { i: 0, resp: [], sel: null }; ir('diag'); },
  diagSel: function (v) { dg.sel = +v; render('[data-acao="diagSel"][data-valor="' + v + '"]'); },
  diagConfirmar: function () { if (dg.sel === null) return; dg.resp[dg.i] = dg.sel; avancarDiag(); },
  diagNaoSei: function () { dg.resp[dg.i] = null; avancarDiag(); },
  diagVoltar: function () {
    erroMsg = null;
    if (dg.i > 0) { dg.i--; dg.sel = dg.resp[dg.i] != null ? dg.resp[dg.i] : null; telaAnterior = null; render(); }
    else ir('diagIntro');
  },

  irInicio: function () { veioDaAula = false; ir('inicio'); },
  irPlano: function () { ir('plano'); },
  irProgresso: function () { veioDaAula = false; ir('progresso'); },

  aulaIniciar: function () {
    const h = aulaDeHoje();
    if (!h) return;
    let base = { area: h.area, assunto: h.assunto || '', tipo: h.tipo };
    if (h.status === 'feito') {        // já estudou hoje: mais um pouco, em revisão
      const a = (S.aulasRecentes || []).find(function (x) { return x.dia === hojeISO(); });
      base = { area: a ? a.materia : h.area, assunto: a ? a.assunto : '', tipo: 'revisao' };
    }
    const salvo = lerAulaSalva();
    if (salvo && salvo.dia === hojeISO() && salvo.area === base.area && salvo.assunto === base.assunto && salvo.usuario === S.perfil.usuario) {
      au = salvo; au.carregando = false; au.erro = null; au.limite = false; au.sel = null;
      ir('aula');
      if (!au.conversa.length || au.conversa[au.conversa.length - 1].de === 'aluna') pedirIA();
      return;
    }
    au = { usuario: S.perfil.usuario, dia: hojeISO(), area: base.area, assunto: base.assunto, tipo: base.tipo,
      titulo: base.tipo === 'revisao' ? 'Revisão · ' + base.area + (base.assunto ? ' · ' + base.assunto : '') : base.area + (base.assunto ? ' · ' + base.assunto : ''),
      conversa: [], atual: null, sel: null, acertos: 0, erros: 0, textoAberto: '', carregando: false, erro: null, limite: false };
    ir('aula');
    pedirIA();
  },
  aulaSel: function (v) {
    const ult = au.conversa[au.conversa.length - 1];
    if (!ult || ult.resposta != null) return;
    au.sel = +v; render('[data-acao="aulaSel"][data-valor="' + v + '"]');
  },
  aulaConfirmar: function () {
    const ult = au.conversa[au.conversa.length - 1];
    if (au.sel === null || !ult || !ult.dados.questao || ult.resposta != null) return;
    ult.resposta = au.sel;
    if (au.sel === ult.dados.questao.correta) au.acertos++; else au.erros++;
    au.sel = null; guardarAula(); render('#retorno');
  },
  aulaDepoisQuestao: function () {
    const ult = au.conversa[au.conversa.length - 1], q = ult.dados.questao, r = ult.resposta;
    const certo = r === q.correta;
    falarComIA('Respondi a questão marcando ' + LETRAS[r] + ' (' + q.alternativas[r] + '). ' +
      (certo ? 'Acertei.' : 'Errei: a correta era ' + LETRAS[q.correta] + ' (' + q.alternativas[q.correta] + ').') +
      ' O app já me mostrou a explicação dessa questão. Placar da aula: ' + au.acertos + ' de ' + (au.acertos + au.erros) + '.',
      'Marquei ' + LETRAS[r] + (certo ? ' · acertei' : ' · errei'));
  },
  aulaContinuar: function () { falarComIA('Continuar', 'Continuar'); },
  aulaNaoEntendi: function () { falarComIA('NÃO ENTENDI. Explique de novo de outra maneira, mais simples e com um exemplo mais concreto.', 'Não entendi'); },
  aulaOutroExemplo: function () { falarComIA('OUTRO EXEMPLO, por favor. Diferente do anterior.', 'Outro exemplo'); },
  aulaEnviarAberta: function () {
    const t = (au.textoAberto || '').trim();
    if (!t) return;
    au.textoAberto = '';
    falarComIA(t, t);
  },
  aulaEncerrar: function () {
    if (!confirm('Encerrar a aula agora? A Sofia vai fazer o fechamento com o que você estudou até aqui.')) return;
    falarComIA('ENCERRAR AULA. Placar: ' + au.acertos + ' de ' + (au.acertos + au.erros) + ' questões certas. Faça o fechamento e o resumo.', 'Encerrar a aula');
  },
  aulaTentar: function () { pedirIA(); },
  aulaConcluir: function () {
    const u = au, r = (au.atual && au.atual.resumo) || {};
    executar(async function () {
      await rpc('concluir_aula', { p_token: token, p_dia: u.dia, p_materia: u.area, p_assunto: u.assunto || 'Revisão',
        p_acertos: u.acertos, p_erros: u.erros, p_dificuldades: (r.dificuldades || []).join('; ') || null, p_resumo: r });
      apagarAulaSalva();
      const antes = S.niveis[u.area] || 0;
      await carregarDados();
      ultimaAula = { area: u.area, titulo: u.titulo, acertos: u.acertos, erros: u.erros, resumo: r, subiu: (S.niveis[u.area] || 0) > antes };
      subiuHoje = hojeISO(); veioDaAula = true;
      ir('progresso');
    });
  },
  aulaVoltar: function () {
    if (au.atual && au.atual.espera !== 'fim' && !confirm('Sair da aula agora? Ela fica guardada neste celular e você continua de onde parou.')) return;
    ir('inicio');
  },

  sair: function () {
    if (!confirm('Sair desta conta neste celular? Para voltar, você vai precisar do usuário e do PIN.')) return;
    const t = token;
    apagarToken(); token = null; S = novoEstado(); veioDaAula = false;
    rpc('sair', { p_token: t }).catch(function () { });
    ir('boas');
  }
};

/* =================== RENDER =================== */
const app = document.getElementById('app');
function render(foco) {
  app.innerHTML = TELAS[tela]();
  if (tela !== telaAnterior) {
    window.scrollTo(0, 0);
    telaAnterior = tela;
    const campo = app.querySelector('#campo-nome, #campo-usuario, #campo-pin, #adm-email');
    if (campo && !campo.value) campo.focus({ preventScroll: true });
    else { const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  }
  if (foco) {
    const el = app.querySelector(foco);
    if (el) {
      el.focus({ preventScroll: true });
      if (foco === '#retorno' || foco === '#erro') el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (foco === '#nova') el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
}
app.addEventListener('click', function (e) {
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const f = ACOES[b.dataset.acao];
  if (f) f(b.dataset.valor);
});
/* Digitação: atualiza o botão sem redesenhar a tela (o teclado não fecha) */
app.addEventListener('input', function (e) {
  const id = e.target.id;
  if (id === 'campo-pin' || id === 'campo-pin2' || id === 'campo-pin-entrar') {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  }
  const v = e.target.value;
  if (id === 'campo-nome') cad.dados.nome = v;
  else if (id === 'campo-pin') cad.dados.pin = v;
  else if (id === 'campo-pin2') cad.dados.pin2 = v;
  else if (id === 'campo-usuario') ent.usuario = v;
  else if (id === 'campo-pin-entrar') ent.pin = v;
  else if (id === 'adm-email' || id === 'adm-senha') {
    if (id === 'adm-email') adm.email = v; else adm.senha = v;
    const b = app.querySelector('[data-acao="admEntrar"]');
    if (b) b.disabled = ocupado || !(adm.email.trim() && adm.senha);
    return;
  }
  else if (id === 'adm-pin') { e.target.value = v.replace(/\D/g, '').slice(0, 4); adm.pin = e.target.value; return; }
  else if (id === 'campo-aberta') {
    au.textoAberto = v;
    const b = app.querySelector('[data-acao="aulaEnviarAberta"]');
    if (b) b.disabled = !v.trim();
    return;
  }
  else return;

  if (tela === 'cadastro') {
    const btn = app.querySelector('[data-acao="cadContinuar"]');
    if (btn) btn.disabled = ocupado || !cadPodeSeguir();
    const av = app.querySelector('#aviso-pin');
    if (av) av.innerHTML = avisoPin();
    if (id === 'campo-pin' && v.length === 4) { const p2 = app.querySelector('#campo-pin2'); if (p2 && !p2.value) p2.focus(); }
  } else if (tela === 'entrar') {
    const btn = app.querySelector('[data-acao="entrar"]');
    if (btn) btn.disabled = ocupado || !(ent.usuario.trim() && /^\d{4}$/.test(ent.pin));
  }
});
app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'campo-nome' || id === 'campo-pin2') { e.preventDefault(); ACOES.cadContinuar(); }
  else if (id === 'campo-pin') { e.preventDefault(); const p2 = app.querySelector('#campo-pin2'); if (p2) p2.focus(); }
  else if (id === 'campo-usuario') { e.preventDefault(); const p = app.querySelector('#campo-pin-entrar'); if (p) p.focus(); }
  else if (id === 'campo-pin-entrar') { e.preventDefault(); ACOES.entrar(); }
  else if (id === 'adm-email') { e.preventDefault(); const p = app.querySelector('#adm-senha'); if (p) p.focus(); }
  else if (id === 'adm-senha') { e.preventDefault(); ACOES.admEntrar(); }
  else if (id === 'adm-pin') { e.preventDefault(); if (adm.pinPara) ACOES.admPinSalvar(adm.pinPara); }
});

/* ---------- PWA: manifesto embutido (instalar na tela inicial) ---------- */
try {
  const ic512 = document.getElementById('icone-512').href;
  const ic180 = document.querySelector('link[rel="apple-touch-icon"]').href;
  const base = location.href.split('#')[0].split('?')[0];
  const manifesto = { name: 'Sofia — professora para o ENEM', short_name: 'Sofia', start_url: base, scope: base.replace(/[^/]*$/, ''),
    display: 'standalone', background_color: '#061640', theme_color: '#1D4ED8',
    icons: [{ src: ic180, sizes: '180x180', type: 'image/png' }, { src: ic512, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifesto)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);
} catch (e) { }

/* ---------- Abertura do app ---------- */
async function iniciar() {
  if (!token) { ir('boas'); return; }
  ir('carregando');
  try {
    await carregarDados();
    ir(S.diagFeito ? 'inicio' : 'diagIntro');
  } catch (e) {
    if (e.codigo === 'sessao') { apagarToken(); token = null; ent = { usuario: '', pin: '', esqueci: false }; ir('entrar', e.message); }
    else ir('falha', e.message);
  }
}
iniciar();
setTimeout(verificarVersao, 3000);
setInterval(verificarVersao, 30 * 60 * 1000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) verificarVersao(); });
})();
</script>
