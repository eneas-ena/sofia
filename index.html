<html lang="pt-BR">
<head>

<style>
/* ===================== DESIGN SYSTEM (tokens) ===================== */
:root{
  --primaria:#1D4ED8; --sobre-primaria:#FFFFFF;
  --texto:#111827; --texto2:#4B5563;
  --sucesso:#15803D; --sucesso-suave:#F0FDF4; --sobre-sucesso:#FFFFFF;
  --erro:#B91C1C; --erro-suave:#FEF2F2; --sobre-erro:#FFFFFF;
  --conquista:#F59E0B; --sobre-conquista:#111827;
  --fundo:#F8FAFC; --superficie:#FFFFFF; --destaque:#EFF6FF; --borda:#E5E7EB;
  --rotulo:#1D4ED8;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --primaria:#60A5FA; --sobre-primaria:#0F172A;
  --texto:#F9FAFB; --texto2:#CBD5E1;
  --sucesso:#4ADE80; --sucesso-suave:#052E16; --sobre-sucesso:#052E16;
  --erro:#F87171; --erro-suave:#450A0A; --sobre-erro:#450A0A;
  --conquista:#FBBF24; --sobre-conquista:#0F172A;
  --fundo:#0F172A; --superficie:#1E293B; --destaque:#1E3A8A; --borda:#334155;
  --rotulo:#BFDBFE;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primaria);outline-offset:2px}
h1:focus,h2:focus,[tabindex="-1"]:focus{outline:none}

/* ===================== LAYOUT ===================== */
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.tela{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.tela.com-nav{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.acoes{margin-top:auto;padding-top:24px}

/* ===================== TIPOGRAFIA ===================== */
.titulo{font-size:1.5rem;font-weight:700;line-height:2rem}
.subtitulo{font-size:1.125rem;font-weight:600;line-height:1.75rem}
.legenda{font-size:.875rem;line-height:1.25rem;color:var(--texto2)}
.sec{color:var(--texto2)}
.enunciado{margin:8px 0}

/* ===================== TOPO ===================== */
.topo{display:flex;align-items:center;gap:4px;min-height:56px;margin-bottom:8px}
.topo .subtitulo{flex:1}
.cab-inicio{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.btn-icone{width:48px;height:48px;border-radius:50%;border:1px solid var(--borda);background:var(--superficie);color:var(--texto);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn-voltar{border:none;background:transparent;margin-left:-12px}

/* ===================== BOTÕES ===================== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:1rem;line-height:1.5rem;cursor:pointer;border:2px solid var(--primaria);text-align:center}
.btn-primario{background:var(--primaria);color:var(--sobre-primaria)}
.btn-secundario{background:var(--superficie);color:var(--primaria)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn + .btn{margin-top:8px}
.linha-btns{display:flex;gap:8px;margin-bottom:8px}
.linha-btns .btn{margin:0}
.btn-link{background:none;border:none;color:var(--primaria);font-weight:600;min-height:48px;padding:12px;cursor:pointer;text-decoration:underline;display:block;margin:8px auto 0}

/* ===================== PROGRESSO ===================== */
.barra{height:8px;border-radius:999px;background:var(--borda);overflow:hidden;margin-top:8px}
.barra > span{display:block;height:100%;background:var(--primaria);border-radius:999px;transition:width .3s}

/* ===================== BALÃO DA SOFIA ===================== */
.balao{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primaria);color:var(--sobre-primaria);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.balao-corpo{background:var(--destaque);border-radius:16px;padding:12px 16px;flex:1}
.balao-nome{font-size:.875rem;line-height:1.25rem;color:var(--rotulo);font-weight:600;display:block;margin-bottom:2px}

/* ===================== ALTERNATIVAS ===================== */
.opcoes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opcao{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:11px 15px;background:var(--superficie);border:1px solid var(--borda);border-radius:12px;color:var(--texto);text-align:left;cursor:pointer;line-height:1.5rem}
.opcao .txt{flex:1}
.letra{width:32px;height:32px;border-radius:50%;border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.opcao[aria-checked="true"]{border:2px solid var(--primaria);background:var(--destaque);padding:10px 14px}
.opcao[aria-checked="true"] .letra{background:var(--primaria);color:var(--sobre-primaria);border-color:var(--primaria)}
.opcao.correta{border:2px solid var(--sucesso);background:var(--sucesso-suave);padding:10px 14px}
.opcao.correta .letra{background:var(--sucesso);color:var(--sobre-sucesso);border-color:var(--sucesso)}
.opcao.incorreta{border:2px solid var(--erro);background:var(--erro-suave);padding:10px 14px}
.opcao.incorreta .letra{background:var(--erro);color:var(--sobre-erro);border-color:var(--erro)}
.opcao:disabled{cursor:default}
.selo{display:inline-flex;align-items:center;gap:4px;font-size:.875rem;font-weight:600;white-space:nowrap}
.correta .selo{color:var(--sucesso)}
.incorreta .selo{color:var(--erro)}

/* ===================== CAMPOS ===================== */
.campo{margin-top:16px}
.campo label{display:block;margin-bottom:8px}
.campo input{width:100%;min-height:56px;padding:12px 16px;border:1px solid var(--borda);border-radius:12px;background:var(--superficie);color:var(--texto);font:inherit;font-size:1rem}
.campo input:focus{outline:none;border:2px solid var(--primaria);padding:11px 15px}
.campo input.pin{letter-spacing:.5em;font-size:1.25rem;font-weight:600}
.ajuda{margin-top:16px}

/* ===================== MENSAGENS ===================== */
.caixa-erro{display:flex;gap:8px;align-items:flex-start;background:var(--erro-suave);color:var(--texto);border:2px solid var(--erro);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.caixa-erro svg{color:var(--erro);flex-shrink:0;margin-top:2px}
.aviso{color:var(--erro);font-weight:600;margin-top:8px;display:flex;gap:6px;align-items:center}

/* ===================== ETIQUETA / CARTÕES ===================== */
.etiqueta{display:inline-block;background:var(--destaque);color:var(--rotulo);font-size:.875rem;line-height:1.25rem;padding:4px 12px;border-radius:8px;margin:16px 0 8px}
.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:16px;padding:16px}
.cartao-destaque{background:var(--destaque);border:none;margin-top:16px}
.cartao-destaque .rotulo{font-size:.875rem;font-weight:600;letter-spacing:.04em;color:var(--rotulo)}
.cartao-destaque .titulo{margin:4px 0 8px}
.info-linha{display:flex;gap:8px;align-items:flex-start;color:var(--texto2);margin-bottom:16px}
.cartao-conquista{background:var(--conquista);color:var(--sobre-conquista);border:none;display:flex;gap:12px;align-items:center}
.cartao-conquista .subtitulo{line-height:1.5rem}
.cartao-conquista .legenda{color:var(--sobre-conquista)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dupla .cartao{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dupla .cartao-conquista{align-items:flex-start}
.numero{font-size:1.5rem;font-weight:700;line-height:2rem}
.icone-ok{color:var(--sucesso)}
.usuario-grande{font-size:2rem;font-weight:700;line-height:2.5rem;color:var(--texto);margin:4px 0;word-break:break-all}

/* ===================== SEMANA ===================== */
.semana{display:flex;justify-content:space-between;gap:4px;margin-top:12px;list-style:none}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.875rem;color:var(--texto2)}
.bola{width:44px;height:44px;border-radius:50%;border:1px solid var(--borda);background:var(--superficie);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.875rem}
.bola.feito{background:var(--sucesso);border-color:var(--sucesso);color:var(--sobre-sucesso)}
.bola.hoje{border:2px solid var(--primaria);color:var(--primaria)}
.dia.hoje{color:var(--primaria);font-weight:600}

/* ===================== PLANO DA SEMANA ===================== */
.lista-plano{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.item-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-titulo{font-weight:600;margin-top:4px}
.item-hoje{border:2px solid var(--primaria);padding:15px}
.item-descanso{background:transparent}
.selo-dia{display:inline-flex;align-items:center;gap:4px;font-size:.875rem;font-weight:600;white-space:nowrap}
.selo-dia.feito{color:var(--sucesso)}
.selo-dia.hoje{color:var(--primaria)}
.selo-dia.perdido{color:var(--texto2)}

/* ===================== MATÉRIAS ===================== */
.materia{margin-top:16px}
.materia .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.materia .pct{font-size:.875rem;color:var(--texto2);white-space:nowrap}

/* ===================== BOAS-VINDAS / CARREGANDO ===================== */
.centro{text-align:center;margin-top:24px}
.logo{width:96px;height:96px;border-radius:50%;background:var(--primaria);color:var(--sobre-primaria);font-size:3rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.nome-app{font-size:2.25rem;font-weight:700;line-height:2.75rem}
.slogan{color:var(--primaria);font-size:1.125rem;font-weight:600;line-height:1.75rem;margin:12px 0}
.carregando{justify-content:center;align-items:center;text-align:center}
.pulso{animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.5}}

/* ===================== NAVEGAÇÃO INFERIOR ===================== */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--superficie);border-top:1px solid var(--borda);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav-interno{display:flex;max-width:480px;width:100%}
.nav button{flex:1;min-height:64px;background:none;border:none;color:var(--texto2);font-size:.875rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--primaria);font-weight:600}

.versao{text-align:center;font-size:.875rem;color:var(--texto2);margin-top:16px}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>

const SUPABASE_URL   = 'https://ghjbljypxksubmcsvaig.supabase.co';

const PERG_CAD = [

    ajuda: 'Evite números fáceis, como 1234 ou a sua data de aniversário. Não conte o PIN para ninguém.' }
];

/* ---------- Diagnóstico (questões autorais) ---------- */
const AREAS = ['Matemática', 'Biologia', 'Química', 'Física', 'Linguagens', 'Ciências Humanas'];
/* 12 questões: 2 por área (uma básica e uma de raciocínio), intercaladas para não cansar */
const DIAG = [
  { area: 'Matemática', assunto: 'Porcentagem',
    enunciado: 'Uma loja anuncia 20% de desconto em uma mochila que custa R$ 150,00. Qual é o preço da mochila com o desconto?',

  { area: 'Química', assunto: 'Misturas',
    enunciado: 'Ao misturar água e óleo num copo, formam-se duas camadas bem visíveis. Esse sistema é classificado como:',

  { area: 'Química', assunto: 'Transformações químicas',

/* ---------- Datas ---------- */
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function idxSemana(d) { return (d.getDay() + 6) % 7; } // Seg=0 ... Dom=6
function dataExtenso(d) {
  const s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function hojeISO() { return isoLocal(new Date()); }
function segundaDe(d) { const s = new Date(d); s.setHours(12, 0, 0, 0); s.setDate(s.getDate() - idxSemana(s)); return s; }
function numSemana(seg) { return Math.floor(Date.UTC(seg.getFullYear(), seg.getMonth(), seg.getDate()) / 604800000); }
function dataCurta(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function listaTexto(arr) { return arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1]; }

/* =================== PLANO DA SEMANA =================== */
/* Base do prompt (Seg Mat · Ter Bio/Quí · Qua Linguagens · Qui Física/Mat · Sex Humanas · Sáb Redação/revisão),
   ajustada pelo diagnóstico:
   - Terça e quinta: se uma das duas matérias está 30 pontos ou mais abaixo, ela fica com o dia;
     se estão parecidas, alternam a cada semana (começando pela mais fraca).
   - Sábado: uma semana Redação, na outra revisão da matéria mais fraca. */
function gerarPlano(seg) {
  const nv = S.niveis || {}, par = numSemana(seg) % 2 === 0;
  const n = function (a) { return nv[a] || 0; };
  function escolher(a, b) {
    const fraca = n(a) <= n(b) ? a : b, forte = fraca === a ? b : a;
    if (Math.abs(n(a) - n(b)) >= 30) return fraca;
    return par ? fraca : forte;
  }
  const maisFraca = AREAS.slice().sort(function (x, y) { return n(x) - n(y); })[0];
  return [
    { dia: 0, area: 'Matemática', tipo: 'aula' },
    { dia: 1, area: escolher('Biologia', 'Química'), tipo: 'aula' },
    { dia: 2, area: 'Linguagens', tipo: 'aula' },
    { dia: 3, area: escolher('Física', 'Matemática'), tipo: 'aula' },
    { dia: 4, area: 'Ciências Humanas', tipo: 'aula' },
    par ? { dia: 5, area: 'Redação', tipo: 'redacao' } : { dia: 5, area: maisFraca, tipo: 'revisao' }
  ];
}
function planoSalvo(segISO) {
  const p = (S.planos || []).find(function (x) { return x.semana === segISO; });
  return p ? p.plano : null;
}
function planoDe(seg) { return planoSalvo(isoLocal(seg)) || gerarPlano(seg); }
function tituloItem(r) {
  if (r.tipo === 'revisao') return 'Revisão · ' + r.area;
  return r.area + (r.assunto ? ' · ' + r.assunto : '');
}
/* Projeta os assuntos: quem faltou não acumula, o assunto só passa para a próxima aula daquela matéria */
function criarSeletor() {
  const est = new Set((S.estudados || []).map(function (e) { return e.materia + '|' + e.assunto; }));
  const reservados = {};
  return function (area) {
    const t = TRILHAS[area] || [];
    reservados[area] = reservados[area] || new Set();
    for (let i = 0; i < t.length; i++) {
      if (!est.has(area + '|' + t[i]) && !reservados[area].has(t[i])) { reservados[area].add(t[i]); return t[i]; }
    }
    return 'Revisão geral';
  };
}
function projetarSemana(base) {
  const agora = base || new Date(), hi = idxSemana(agora), seg = segundaDe(agora);
  const plano = planoDe(seg), feitos = new Set(S.dias), proximo = criarSeletor();
  return plano.map(function (p) {
    const d = new Date(seg); d.setDate(seg.getDate() + p.dia);
    const iso = isoLocal(d);
    const r = { dia: p.dia, data: d, iso: iso, area: p.area, tipo: p.tipo };
    if (feitos.has(iso)) {
      const a = (S.aulasRecentes || []).find(function (x) { return x.dia === iso; });
      r.status = 'feito';
      r.titulo = a ? a.materia + ' · ' + a.assunto : tituloItem(r);
    } else if (p.dia < hi) {
      r.status = 'perdido';
      r.titulo = r.tipo === 'revisao' ? 'Revisão · ' + r.area : r.area;
    } else {
      r.status = p.dia === hi ? 'hoje' : 'futuro';
      if (r.tipo !== 'revisao') r.assunto = proximo(r.area);
      r.titulo = tituloItem(r);
    }
    return r;
  });
}
function aulaDeHoje() {
  const hi = idxSemana(new Date());
  return hi < 6 ? projetarSemana()[hi] : null;
}
function proximoAssunto() {
  const hoje = new Date(), hi = idxSemana(hoje);
  if (hi < 5) return 'Amanhã: ' + projetarSemana()[hi + 1].titulo + '.';
  const seg = segundaDe(hoje); seg.setDate(seg.getDate() + 7);
  const p = planoDe(seg)[0], r = { area: p.area, tipo: p.tipo };
  if (p.tipo !== 'revisao') r.assunto = criarSeletor()(p.area);
  const titulo = tituloItem(r);
  return hi === 5 ? 'Amanhã é domingo, dia de descanso. Na segunda: ' + titulo + '.' : 'Amanhã: ' + titulo + '.';
}
function textoAtencao() {
  const nv = S.niveis || {};
  const fracas = AREAS.filter(function (a) { return (nv[a] || 0) < 50; })
    .sort(function (x, y) { return (nv[x] || 0) - (nv[y] || 0); }).slice(0, 3);
  return fracas.length
    ? 'Vou dar atenção especial a ' + listaTexto(fracas) + '.'
    : 'Você foi bem em todas as áreas do diagnóstico. Vamos manter o ritmo e aprofundar.';
}
function duracaoAula(r) {
  const m = (S.perfil && MINUTOS[S.perfil.tempo_diario]) || 60;
  return m + ' min · ' + (r.tipo === 'redacao' ? 'explicação e escrita' : r.tipo === 'revisao' ? 'revisão e exercícios' : 'revisão, explicação e exercícios');
}
/* Sequência de dias: domingo sem estudo não quebra a sequência */
function calcularSequencia(dias) {
  const set = new Set(dias || []);
  const d = new Date();
  if (!set.has(isoLocal(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  for (let k = 0; k < 400; k++) {
    if (set.has(isoLocal(d))) n++;
    else if (d.getDay() !== 0) break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function textoSequencia(n) { return n === 1 ? '1 dia seguido' : n + ' dias seguidos'; }

/* =================== CONEXÃO COM O SUPABASE =================== */
async function rpc(nome, params) {
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nome, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_CHAVE, 'Content-Type': 'application/json', 'Content-Profile': SCHEMA, 'Accept-Profile': SCHEMA },
      body: JSON.stringify(params || {})
    });
  } catch (e) {
    throw new Error('Sem conexão com a internet. Confira e tente de novo.');
  }
  let dados = null;
  try { dados = await r.json(); } catch (e) { }
  if (!r.ok) {
    console.error('Sofia:', nome, r.status, dados);
    throw new Error('Não consegui falar com o servidor (erro ' + r.status + '). Tente de novo daqui a pouco.');
  }
  if (dados && dados.erro) {
    const e = new Error(dados.erro === 'sessao' ? 'Sua sessão terminou. Entre de novo com seu usuário e PIN.' : dados.erro);
    e.codigo = dados.erro;
    throw e;
  }
  return dados;
}
function lerToken() { try { return localStorage.getItem(CHAVE_TOKEN); } catch (e) { return null; } }
function gravarToken(t) { try { localStorage.setItem(CHAVE_TOKEN, t); } catch (e) { } }
function apagarToken() { try { localStorage.removeItem(CHAVE_TOKEN); } catch (e) { } }

async function salvarPlano(seg, plano) {
  const iso = isoLocal(seg);
  S.planos = [{ semana: iso, plano: plano }].concat((S.planos || []).filter(function (x) { return x.semana !== iso; }));
  try { await rpc('salvar_plano', { p_token: token, p_semana: iso, p_plano: plano }); }
  catch (e) { console.error('Sofia: plano não salvo', e); } // o plano continua valendo neste celular
}

    barra((cad.passo + 1) / total * 100, 'Progresso do cadastro') +

    '<p class="legenda ajuda">' + esc(p.ajuda) + '</p>' +

    '</main>';

function avisoPin() {
  const d = cad.dados;
  if (d.pin && d.pin2 && d.pin.length === 4 && d.pin2.length === 4 && d.pin !== d.pin2) return ic('x', 18) + 'Os dois PINs não são iguais.';
  return '';
}
function cadPodeSeguir() {
  const p = PERG_CAD[cad.passo], d = cad.dados, v = d[p.chave];
  if (p.opcional) return true;
  if (p.tipo === 'texto') return !!(v && v.trim());
  if (p.tipo === 'pin') return /^\d{4}$/.test(d.pin || '') && d.pin === d.pin2;
  return !!v;
}

/* =================== AÇÕES =================== */
function calcularNiveis(resp) {
  const tot = {}, ac = {}, niv = {};
  let total = 0;
  DIAG.forEach(function (q, i) {
    tot[q.area] = (tot[q.area] || 0) + 1;
    if (resp[i] === q.correta) { ac[q.area] = (ac[q.area] || 0) + 1; total++; }
  });
  AREAS.forEach(function (a) { niv[a] = tot[a] ? Math.round((ac[a] || 0) / tot[a] * 100) : 0; });
  return { niveis: niv, acertos: total };
}
function ir(t, msg) { tela = t; erroMsg = msg || null; render(); }

/* Executa uma tarefa que fala com o servidor, mostrando "Aguarde…" e os erros */
async function executar(tarefa) {
  if (ocupado) return;
  ocupado = true; erroMsg = null; render();
  try {
    await tarefa();
    ocupado = false; render();
  } catch (e) {
    ocupado = false;
    if (e.codigo === 'sessao') { apagarToken(); token = null; ent = { usuario: '', pin: '', esqueci: false }; ir('entrar', e.message); render('#erro'); return; }
    erroMsg = e.message || 'Algo deu errado.';
    render('#erro');
  }
}

async function finalizarDiag() {
  const r = calcularNiveis(dg.resp);
  await executar(async function () {
    await rpc('salvar_diagnostico', { p_token: token, p_respostas: dg.resp.map(function (x) { return x == null ? null : x; }), p_acertos: r.acertos, p_niveis: r.niveis });
    S.niveis = r.niveis; S.acertosDiag = r.acertos; S.diagFeito = true;
    const seg = segundaDe(new Date());
    await salvarPlano(seg, gerarPlano(seg)); // plano refeito com o resultado novo
    ir('diagResultado');
  });
}
function avancarDiag() {
  if (dg.i >= DIAG.length - 1) { finalizarDiag(); return; }
  dg.i++;
  dg.sel = dg.resp[dg.i] != null ? dg.resp[dg.i] : null;
  telaAnterior = null; render();
}

      await carregarDados();
      ir('contaCriada');
    });
  },
  cadVoltar: function () { erroMsg = null; if (cad.passo > 0) { cad.passo--; telaAnterior = null; render(); } else ir('boas'); },

  irDiagIntro: function () { ir('diagIntro'); },
  diagIniciar: function () { dg = { i: 0, resp: [], sel: null }; ir('diag'); },
  diagSel: function (v) { dg.sel = +v; render('[data-acao="diagSel"][data-valor="' + v + '"]'); },

  },
  aulaOutroExemplo: function () {
    const t = AULA.questoes[au.i].exemplo;
    if (au.extras.indexOf(t) < 0) au.extras.push(t);
    render('[data-acao="aulaOutroExemplo"]');
  },
  aulaProxima: function () { au.i++; au.sel = null; au.respondida = false; au.extras = []; telaAnterior = null; render(); },
  aulaConcluir: function () {
    const n = AULA.questoes.length;
    executar(async function () {
      await rpc('registrar_aula', { p_token: token, p_dia: hojeISO(), p_materia: AULA.materia, p_assunto: AULA.assunto, p_acertos: au.acertos, p_erros: n - au.acertos });
      await carregarDados();
      acertosUltima = au.acertos; subiuHoje = hojeISO(); veioDaAula = true;
      ir('progresso');
    });
  },
  aulaVoltar: function () {
    if ((au.i > 0 || au.respondida) && !confirm('Sair da aula agora? As respostas desta aula não serão guardadas.')) return;
    ir('inicio');
  },

  sair: function () {
    if (!confirm('Sair desta conta neste celular? Para voltar, você vai precisar do usuário e do PIN.')) return;
    const t = token;
    apagarToken(); token = null; S = novoEstado(); veioDaAula = false;
    rpc('sair', { p_token: t }).catch(function () { });
    ir('boas');
  }
};

/* =================== RENDER =================== */
const app = document.getElementById('app');
function render(foco) {
  app.innerHTML = TELAS[tela]();
  if (tela !== telaAnterior) {
    window.scrollTo(0, 0);
    telaAnterior = tela;
    const campo = app.querySelector('#campo-nome, #campo-usuario, #campo-pin');
    if (campo && !campo.value) campo.focus({ preventScroll: true });
    else { const h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  }
  if (foco) {
    const el = app.querySelector(foco);
    if (el) {
      el.focus({ preventScroll: true });
      if (foco === '#retorno' || foco === '#erro') el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
}
app.addEventListener('click', function (e) {
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const f = ACOES[b.dataset.acao];
  if (f) f(b.dataset.valor);
});
/* Digitação: atualiza o botão sem redesenhar a tela (o teclado não fecha) */
app.addEventListener('input', function (e) {
  const id = e.target.id;
  if (id === 'campo-pin' || id === 'campo-pin2' || id === 'campo-pin-entrar') {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  }
  const v = e.target.value;
  if (id === 'campo-nome') cad.dados.nome = v;
  else if (id === 'campo-pin') cad.dados.pin = v;
  else if (id === 'campo-pin2') cad.dados.pin2 = v;
  else if (id === 'campo-usuario') ent.usuario = v;
  else if (id === 'campo-pin-entrar') ent.pin = v;
  else return;

  if (tela === 'cadastro') {
    const btn = app.querySelector('[data-acao="cadContinuar"]');
    if (btn) btn.disabled = ocupado || !cadPodeSeguir();
    const av = app.querySelector('#aviso-pin');
    if (av) av.innerHTML = avisoPin();
    if (id === 'campo-pin' && v.length === 4) { const p2 = app.querySelector('#campo-pin2'); if (p2 && !p2.value) p2.focus(); }
  } else if (tela === 'entrar') {
    const btn = app.querySelector('[data-acao="entrar"]');
    if (btn) btn.disabled = ocupado || !(ent.usuario.trim() && /^\d{4}$/.test(ent.pin));
  }
});
app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'campo-nome' || id === 'campo-pin2') { e.preventDefault(); ACOES.cadContinuar(); }
  else if (id === 'campo-pin') { e.preventDefault(); const p2 = app.querySelector('#campo-pin2'); if (p2) p2.focus(); }
  else if (id === 'campo-usuario') { e.preventDefault(); const p = app.querySelector('#campo-pin-entrar'); if (p) p.focus(); }
  else if (id === 'campo-pin-entrar') { e.preventDefault(); ACOES.entrar(); }
});

/* ---------- PWA: manifesto embutido (instalar na tela inicial) ---------- */
try {
  const icone = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='256' fill='%231D4ED8'/%3E%3Ctext x='256' y='340' font-family='Arial,sans-serif' font-size='260' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E";
  const base = location.href.split('#')[0].split('?')[0];
  const manifesto = { name: 'Sofia — professora para o ENEM', short_name: 'Sofia', start_url: base, scope: base.replace(/[^/]*$/, ''),
    display: 'standalone', background_color: '#F8FAFC', theme_color: '#1D4ED8',
    icons: [{ src: icone, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }] };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifesto)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);
} catch (e) { }

/* ---------- Abertura do app ---------- */
async function iniciar() {
  if (!token) { ir('boas'); return; }
  ir('carregando');
  try {
    await carregarDados();
    ir(S.diagFeito ? 'inicio' : 'diagIntro');
  } catch (e) {
    if (e.codigo === 'sessao') { apagarToken(); token = null; ent = { usuario: '', pin: '', esqueci: false }; ir('entrar', e.message); }
    else ir('falha', e.message);
  }
}
iniciar();
})();
